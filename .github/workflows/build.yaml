name: Build sxac

# Nobody pushes to a fork for months, so the weekly run is what catches a toolchain
# that stopped compiling it. Pushes to master go through release.yaml, which builds
# the same way.
on:
  pull_request:
    branches:
      - "master"
      - "deps"
  schedule:
    - cron: "51 5 * * 1" # Weekly, on Mondays
  workflow_dispatch:

jobs:
  # A job's container is chosen before any of its steps run, so reading the pin needs a job of
  # its own. .devcontainer.json is the only place this image is named.
  image:
    name: Read the pinned dev image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read .devcontainer.json
        id: pin
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ needs.image.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the checks
        run: ./scripts/ci.sh

  deb:
    name: Build the Debian package
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2
    steps:
      - name: Install the packaging tools
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y -qq ca-certificates git make gcc \
            libc6-dev libx11-dev libxtst-dev dpkg-dev lintian
          git config --system --add safe.directory '*'
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the package
        run: ./scripts/deb.sh
      - name: Run lintian
        run: lintian --fail-on error,warning sxac_*.deb
