name: Build sxac

# Nobody pushes to a fork for months, so the weekly run is what catches a toolchain
# that stopped compiling it. Pushes to master go through release.yaml, which builds
# the same way.
on:
  pull_request:
    branches:
      - "master"
  schedule:
    - cron: "51 5 * * 1" # Weekly, on Mondays
  workflow_dispatch:

jobs:
  # A job's container is chosen before any of its steps run, so reading the pin needs a job of
  # its own. .devcontainer.json is the only place this image is named.
  image:
    name: Read the pinned dev image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read .devcontainer.json
        id: pin
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ needs.image.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the checks
        run: ./scripts/ci.sh
