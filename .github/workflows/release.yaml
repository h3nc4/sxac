name: Release sxac

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # A job's container is chosen before any of its steps run, so reading the pin needs a job of
  # its own. .devcontainer.json is the only place this image is named.
  image:
    name: Read the pinned dev image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read .devcontainer.json
        id: pin
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  deb:
    name: Build the Debian package
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2
    steps:
      - name: Install the packaging tools
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y -qq ca-certificates git make gcc \
            libc6-dev libx11-dev libxtst-dev dpkg-dev lintian
          git config --system --add safe.directory '*'
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the package
        run: ./scripts/deb.sh
      - name: Run lintian
        run: lintian --fail-on error,warning sxac_*.deb
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb
          path: sxac_*.deb
          if-no-files-found: error

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs:
      - image
      - deb
    container:
      image: ${{ needs.image.outputs.ref }}
    permissions:
      contents: write # creates the release
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the release artifact
        run: make dist
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb
      - name: Import the signing key
        run: echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Sign the artifacts
        run: |
          for file in sxac.tar.gz sxac_*.deb; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --detach-sign --armor -o "${file}.asc" "${file}"
          done
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run softprops/action-gh-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            sxac.tar.gz.asc
            sxac.tar.gz
            sxac_*.deb.asc
            sxac_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
