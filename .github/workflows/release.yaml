name: Release sxac

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # A job's container is chosen before any of its steps run, so reading the pin needs a job of
  # its own. .devcontainer.json is the only place this image is named.
  image:
    name: Read the pinned dev image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read .devcontainer.json
        id: pin
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ needs.image.outputs.ref }}
    permissions:
      contents: write # creates the release
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the release artifact
        run: make dist
      - name: Import the signing key
        run: echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Sign the artifact
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --detach-sign --armor -o sxac.tar.gz.asc sxac.tar.gz
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run softprops/action-gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            sxac.tar.gz.asc
            sxac.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
